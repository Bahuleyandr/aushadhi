# Independent residential split-tunnel for the Apollo crawler (mark 0xa06,
# priority 3996) — isolated from the 1mg crawler's 0xa05/4000 rules so the two
# services never interfere. Apollo works via Proton today, but its datacenter
# exit IP is a block risk under sustained load (as 1mg proved), so route only
# this service's cgroup traffic out the residential LAN. See ../README.md.
[Service]
ExecStartPre=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; ip rule del fwmark 0xa06 lookup main priority 3996 2>/dev/null; ip rule add fwmark 0xa06 lookup main priority 3996'
ExecStartPre=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; iptables -t mangle -C OUTPUT -m cgroup --path system.slice/aushadhi-apollo.service -j MARK --set-mark 0xa06 2>/dev/null || iptables -t mangle -A OUTPUT -m cgroup --path system.slice/aushadhi-apollo.service -j MARK --set-mark 0xa06'
ExecStartPre=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; iptables -t nat -C POSTROUTING -o enx00e04c3e5d80 -m mark --mark 0xa06 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o enx00e04c3e5d80 -m mark --mark 0xa06 -j MASQUERADE'
ExecStopPost=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; iptables -t nat -D POSTROUTING -o enx00e04c3e5d80 -m mark --mark 0xa06 -j MASQUERADE 2>/dev/null; iptables -t mangle -D OUTPUT -m cgroup --path system.slice/aushadhi-apollo.service -j MARK --set-mark 0xa06 2>/dev/null; ip rule del fwmark 0xa06 lookup main priority 3996 2>/dev/null; true'
