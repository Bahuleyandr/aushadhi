# Split-tunnel: route ONLY this crawler's traffic out the residential LAN path,
# bypassing ProtonVPN — whose datacenter exit IP Cloudflare/1mg blocks (403).
# Every other service on the host stays on Proton. Three rules, added on start
# and removed on stop, so nothing lingers when the crawler is idle:
#   1. ip rule: fwmark 0xa05 -> main table (LAN/residential route)
#   2. mangle: mark this service's cgroup traffic with 0xa05
#   3. nat MASQUERADE: rewrite source to the LAN IP (post-mangle reroute otherwise
#      keeps Proton's tunnel src 10.2.0.2 and replies never return -> ETIMEDOUT)
[Service]
ExecStartPre=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; ip rule del fwmark 0xa05 lookup main priority 4000 2>/dev/null; ip rule add fwmark 0xa05 lookup main priority 4000'
ExecStartPre=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; iptables -t mangle -C OUTPUT -m cgroup --path system.slice/aushadhi-crawl.service -j MARK --set-mark 0xa05 2>/dev/null || iptables -t mangle -A OUTPUT -m cgroup --path system.slice/aushadhi-crawl.service -j MARK --set-mark 0xa05'
ExecStartPre=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; iptables -t nat -C POSTROUTING -o enx00e04c3e5d80 -m mark --mark 0xa05 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o enx00e04c3e5d80 -m mark --mark 0xa05 -j MASQUERADE'
ExecStopPost=/bin/sh -c 'export PATH=/usr/sbin:/sbin:/usr/bin:/bin; iptables -t nat -D POSTROUTING -o enx00e04c3e5d80 -m mark --mark 0xa05 -j MASQUERADE 2>/dev/null; iptables -t mangle -D OUTPUT -m cgroup --path system.slice/aushadhi-crawl.service -j MARK --set-mark 0xa05 2>/dev/null; ip rule del fwmark 0xa05 lookup main priority 4000 2>/dev/null; true'
