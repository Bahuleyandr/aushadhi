# Crawler log directories are root-owned so the runtime user cannot replace a
# health-observed log path. The exact regular files remain runtime-readable and
# writable; type f never truncates an existing file and never follows symlinks.
d /var/log/aushadhi 0750 root aushadhi -
d /var/log/aushadhi/onemg 0750 root aushadhi -
f /var/log/aushadhi/onemg/crawl.log 0640 aushadhi aushadhi -
d /var/log/aushadhi/apollo 0750 root aushadhi -
f /var/log/aushadhi/apollo/apollo.log 0640 aushadhi aushadhi -
d /var/log/aushadhi/pharmeasy 0750 root aushadhi -
f /var/log/aushadhi/pharmeasy/pharmeasy.log 0640 aushadhi aushadhi -
d /var/log/aushadhi/netmeds 0750 root aushadhi -
f /var/log/aushadhi/netmeds/netmeds.log 0640 aushadhi aushadhi -
