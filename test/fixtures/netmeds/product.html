cine Online, Medicine Store, Online Medical Store, Purchase Medicine,diabetes","seometadescription":"Get up to 20% discount on prescription medicine ACIFORMIN 500 Tablet 10's online, compare prices avail cashback. Check generic medicine substitute Get doorstep delivery anywhere in India.","seotitle":"ACIFORMIN 500 Tablet 10's - Buy Medicines online at Best Price from Netmeds.com","taxpercentage":"5P","hsncode":"30049099","cimssubcategoryname":"Antidiabetic Agents","cimsclassification":"CHRONIC","cimscategoryname":"Endocrine & Metabolic System","manufacturername":"ACIDUS OJAS PRIVATE LIMITED","marketername":"ACIDUS OJAS PRIVATE LIMITED","genericnamewithdosage":"Metformin 500 mg","genericname":"Metformin","flatdiscount":0,"itemdiscount":0,"dpcoceilingmrp":21.74,"mrp":16.1,"branddiscount":0,"brandid":227846,"productrating":0,"b2b-unitsaleflag":"Y","b2b-minmargin":12,"b2b-defaultqty":1,"b2b-maximumqty":99999,"b2b-minimumqty":1,"b2b-ptrpercentage":80,"b2b-marginpercentage":12,"dpcodiscountflag":"N","isinflammable":"N","isfssaiapplicable":"N","recommqty":0,"shortexpiry":0,"inventoryleastexpdate":"2026-07-04T06:10:34.000Z","inventoryminqty":0,"inventorymaxqty":0,"vendornonreturnable":"N","cartonqty":0,"boxpackqty":0,"isvegitem":" ","fssaino":"0","releasetypename":"Immediate Release","isallowpayment":"Y","requestby":"Others","modifieddate":"2026-04-04T12:44:54.000Z","createddate":"2022-06-13T08:26:58.000Z","refillstatus":" ","procuredby":"P","unitcount":10,"onlinesalestatus":"BOTH","unitsaleflag":"Y","boxqty":0,"foodlabel":"N","dpcostatus":"Y","coldstorage":"N","refundstatus":"N","inventorylookup":"Y","searchkeys":"Aciformin,Antidiabetic Agents,Diabetes","cartmaxqty":30,"cartminqty":1,"dosage":"500","packsizeunit":"S","packsize":"10","packagetype":"STRIP","itemtype":"Tablet","schedule":"H","producttype":"P","availabilitystatus":"I","pharmadescription":"<div class=\"quick_links\"><h2 class=\"quick_links_title\">Quick Links</h2><div class=\"quicklinks\"><a href=\"#21\">Uses</a>|<a href=\"#23\">How it works</a>|<a href=\"#3\">Directions for use</a>|<a href=\"#4\">Side effects</a>|<a href=\"#1\">Warning & precautions</a>|<a href=\"#2\">Interactions</a>|<a href=\"#26\">Synopsis</a>|<a href=\"#30\">Useful diagnostic tests</a></div></div><div class=\"prescript-txt product_desc_info\">\r\n<div><div id=\"np_tab1\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"19\">Introduction About ACIFORMIN 500 TABLET</h2><p>ACIFORMIN 500 TABLET is used to manage type II diabetes mellitus when diet and exercise alone does not result in adequate blood sugar control. It contains Metformin which belongs to the group of medicines called Anti-diabetic agents. It makes the body more sensitive to insulin (a hormone involved in glucose metabolism). This helps our body cells to utilize more amount of the circulating blood glucose, thereby reducing blood sugar levels. Additionally, it also manages glucose production by the liver and reduces its absorption in the body.</p>\n\n<p>Along with the therapy, your doctor might ask you to make certain lifestyle changes such as following a healthy diet, regular physical exercise and quitting alcohol consumption. Before taking ACIFORMIN 500 TABLET inform your doctor if you have any liver, kidney or heart problems. You must also inform your doctor if you have any severe systemic infections or are severely dehydrated due to excessive vomiting or diarrhea recently.</p>\n\n<p>ACIFORMIN 500 TABLET is not recommended for use in patients with severe uncontrollable diabetes. It is also not suitable for use in patients with shock or problems with breathing or blood circulation. Consult your doctor before taking ACIFORMIN 500 TABLET if you are pregnant or breastfeeding. The most common side effects are stomach upset and diarrhea. These side effects can be controlled when the medicine is taken along with meals. However, if these side effect bothers you or worsens contact your doctor.</p>\n </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab3\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"21\">Uses Of ACIFORMIN 500 TABLET</h2><ul>\n\t<li>Used to manage type II diabetes mellitus</li>\n</ul>\n </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab6\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"23\">How ACIFORMIN 500 TABLET Works</h2><p>ACIFORMIN 500 TABLET makes the body more sensitive to insulin (a hormone involved in glucose metabolism). This helps our body cells to utilize more amount of the circulating blood glucose, thereby reducing blood sugar levels. Additionally, it also manages glucose production by the liver and reduces its absorption in the body.</p>\n </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab7\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"3\">How to use ACIFORMIN 500 TABLET</h2><ul>\n\t<li>Take ACIFORMIN 500 TABLET preferably after meals or as advised by your physician</li>\n\t<li>Swallow the medicine with a glass of water. Do not crush or chew the medicine</li>\n\t<li>Your doctor will decide the correct dose and duration of therapy for you depending upon your age, body weight and disease condition</li>\n\t<li>Do not stop taking ACIFORMIN 500 TABLET unless your doctor advice you to stop</li>\n</ul>\n </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab10\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"4\">Side Effects Of ACIFORMIN 500 TABLET</h2><h3><strong>Common side effects of ACIFORMIN 500 TABLET:</strong></h3>\n\n<ul>\n\t<li>diarrhea, stomach pain, loss of appetite</li>\n\t<li>changes in taste, metallic taste</li>\n</ul>\n\n<p>Stop taking ACIFORMIN 500 TABLET and consult your doctor immediately if you experience any of the following side effects:</p>\n\n<ul>\n\t<li>serious allergic reaction (such as hives, swelling of the face, lips, tongue or throat causing difficulty in breathing or swallowing)</li>\n\t<li>signs of liver problems (such as nausea or vomiting, stomach pain, unusual or unexplained tiredness, loss of appetite, dark urine, yellowing of the skin or the whites of the eyes)</li>\n\t<li>signs of lactic acidosis (cold hands or feet, dizziness or light-headedness, slow or irregular heartbeat, weakness or tiredness, unusual muscle pain, trouble breathing, sleepiness or drowsiness, stomach pains, nausea or vomiting)</li>\n</ul>\n </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab12\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"1\">Warning & Precautions</h2><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/FHjz8Z-MN6-pregnancy.jpg\" alt=\"\"><h3>Pregnancy</h3><span class=\"consult\">Consult your doctor</span></div><div class=\"manage-rightcontent\"><p>There is a limited amount of data from the use of ACIFORMIN 500 TABLET in pregnant women. Hence consult your doctor for advice.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/qIbWeGYUWL-breastfeeding.jpg\" alt=\"\"><h3>Breastfeeding</h3><span class=\"consult\">Consult your doctor</span></div><div class=\"manage-rightcontent\"><p>There is a limited amount of data from the use of ACIFORMIN 500 TABLET in breastfeeding women. Hence consult your doctor for advice.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/vOgzHuYx-b-driving_and_using_machines.jpg\" alt=\"\"><h3>Driving and Using Machines</h3><span class=\"caution\">Use with Caution</span></div><div class=\"manage-rightcontent\"><p>Do not drive or operate any heavy tools or machines if your ability is affected by the medicine.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/H_np9PCx39-alcohol.jpg\" alt=\"\"><h3>Alcohol</h3><span class=\"consult\">Consult your doctor</span></div><div class=\"manage-rightcontent\"><p>Avoid consumption of alcohol while taking ACIFORMIN 500 TABLET as it may increase the risk of unwanted side effects.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/o5nZIF3Sy1-kidney.jpg\" alt=\"\"><h3>Kidney</h3><span class=\"contraindicated\">Contraindicated</span></div><div class=\"manage-rightcontent\"><p>ACIFORMIN 500 TABLET is not recommended for use in patients with severe kidney problems.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/0B2MqvShgX-liver.jpg\" alt=\"\"><h3>Liver</h3><span class=\"consult\">Consult your doctor</span></div><div class=\"manage-rightcontent\"><p>ACIFORMIN 500 TABLET is not recommended for use in patients with severe liver problems. It should be used with caution in patients with other liver problems.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/vlZDPsL4fB-allergy.jpg\" alt=\"\"><h3>Allergy</h3><span class=\"contraindicated\">Contraindicated</span></div><div class=\"manage-rightcontent\"><p>Do not take ACIFORMIN 500 TABLET if you are allergic to Metformin or any other ingredients of this medicine.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/Ox6XgTXVlP-lungs.jpg\" alt=\"\"><h3>Lungs</h3><span class=\"contraindicated\">Contraindicated</span></div><div class=\"manage-rightcontent\"><p>It is not recommended for use in patients with severe infection of lungs or respiratory tract.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/PFd7W3oE4g-heart_disease.jpg\" alt=\"\"><h3>Heart Disease</h3><span class=\"contraindicated\">Contraindicated</span></div><div class=\"manage-rightcontent\"><p>ACIFORMIN 500 TABLET is not recommended for use in patients with heart problems (such as acute heart failure or a recent heart attack).</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/3zIpEU3Vmf-use_in_pediatrics.jpg\" alt=\"\"><h3>Use In Pediatrics</h3><span class=\"consult\">Consult your doctor</span></div><div class=\"manage-rightcontent\"><p>ACIFORMIN 500 TABLET has not been studied in children. Consult your doctor for advice.</p>\n</div></div><div class=\"manage-content\"><div class=\"manage-leftcontent\"><img src=\"https://cdn.pixelbin.io/v2/catalog-cloud/ccprod/original/products/assets/item/free/original/glWOExgqwt-use_in_geriatrics.jpg\" alt=\"\"><h3>Use In Geriatrics</h3><span class=\"caution\">Use with Caution</span></div><div class=\"manage-rightcontent\"><p>ACIFORMIN 500 TABLET should be used with caution in elderly patients (aged above 65 years).</p>\n</div></div><div id=\"np_tab12_12\" class=\"druginfo_cont druginfo-dv active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h3>Others</h3><p>ACIFORMIN 500 TABLET is not recommended for use if you:</p>\n\n<ul>\n\t<li>have severe, uncontrollable diabetes</li>\n\t<li>have lactic acidosis or ketoacidosis &nbsp;</li>\n\t<li>are dehydrated &nbsp;</li>\n\t<li>have any systemic infection &nbsp;</li>\n\t<li>have shock or problems in blood circulation</li>\n\t<li>have breathing problems</li>\n\t<li>are an alcoholic</li>\n</ul>\n\n<p>Before taking ACIFORMIN 500 TABLET, inform your doctor if you:</p>\n\n<ul>\n\t<li>are about to have any X-ray or scan</li>\n\t<li>are about a have a major surgery</li>\n\t<li>are in fasting</li>\n</ul>\n </div>  <div class=\"clear1\"></div></div></div></div> </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab18\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"2\">Interactions</h2><p><strong>A. Drug-Drug interactions:</strong></p>\n\n<p>Before taking ACIFORMIN 500 TABLET, inform your doctor if you are taking any of the following medicines such as:</p>\n\n<ul>\n\t<li>Anti-diabetics agents (Ex. teneligliptin, rosiglitazone, pioglitazone, glimepiride)</li>\n\t<li>Diuretics (Ex. furosemide, hydrochlorothiazide)</li>\n\t<li>Non-steroidal inflammatory agents (Ex. ibuprofen, celecoxib)</li>\n\t<li>Antihypertensives (Ex. atenolol, propranolol, captopril, enalapril, ramipril, lisinopril, losartan, valsartan, olmesartan, telmisartan)</li>\n\t<li>Bronchodilators (Ex. salbutamol, terbutaline)</li>\n\t<li>Corticosteroids (Ex. hydrocortisone, prednisolone)</li>\n\t<li>Calcium-channel blockers (Ex. verapamil)</li>\n\t<li>Antibiotics (Ex. rifampicin)</li>\n\t<li>H2 blockers (Ex. cimetidine)</li>\n\t<li>Anti-viral agents (Ex. dolutegravir)</li>\n\t<li>Anti-anginals (Ex. ranolazine)</li>\n\t<li>Folic acid inhibitors (Ex. trimethoprim)</li>\n\t<li>Kinase inhibitors (Ex. vandetanib, crizotinib, olaparib)</li>\n\t<li>Anti-fungals (Ex. isavuconazole)</li>\n</ul>\n\n<p><strong>Overdosage:</strong></p>\n\n<p>If you or anyone else accidentally takes more ACIFORMIN 500 TABLET, consult your doctor immediately or visit the nearby hospital. Symptoms of overdose are vomiting, stomach pain with muscle cramps, feeling generally unwell with severe tiredness and difficulty in breathing.</p>\n </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab21\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"26\">Synopsis</h2><table border=\"0\" cellpadding=\"1\" cellspacing=\"1\">\n\t<tbody>\n\t\t<tr>\n\t\t\t<td><strong>Drug</strong></td>\n\t\t\t<td>:&nbsp;&nbsp;</td>\n\t\t\t<td>Metformin</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Pharmacological Category</strong></td>\n\t\t\t<td>:&nbsp;&nbsp;</td>\n\t\t\t<td>Biguanides</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Therapeutic Indication</strong></td>\n\t\t\t<td>:&nbsp;&nbsp;</td>\n\t\t\t<td>Type II Diabetes mellitus&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td><strong>Dosage Forms</strong></td>\n\t\t\t<td>:&nbsp;&nbsp;</td>\n\t\t\t<td>Tablet</td>\n\t\t</tr>\n\t</tbody>\n</table>\n </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab22\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"5\">More Information</h2><iframe width=\"100%\" height=\"auto\" padded: \"10px\" src=\"https://www.youtube.com/embed/kreRLtNPzq8?rel=0\" title=\"Metformin Hydrochloride Tablet - Drug Information\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen loading=\"lazy\"></iframe> </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab24\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"27\">FAQs About ACIFORMIN 500 TABLET</h2><div itemscope itemtype=\"https://schema.org/FAQPage\" class=\"nms-faqpage\">\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: What is ACIFORMIN 500 TABLET used for?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: ACIFORMIN 500 TABLET is used to manage type II diabetes mellitus when diet, exercise and lifestyle changes alone does not result in adequate response.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: How and when to take ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: Take ACIFORMIN 500 TABLET preferably after meals or as advised by your physician. Swallow the medicine with a glass of water. Do not crush or chew the medicine. Your doctor will decide the correct dose and duration of therapy for you depending upon your age, body weight and disease condition.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: How long should I take ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: You need to take ACIFORMIN 500 TABLET as long as your doctor or physician prescribes you the medicine. Your doctor will decide the correct dose and duration of therapy for you depending upon your age, body weight and disease condition.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: What is the best time to take ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: ACIFORMIN 500 TABLET must be taken with meals to avoid gastrointestinal side effects.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: What to do if I forgot to take a dose of ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: If you forgot to take a dose of ACIFORMIN 500 TABLET, take it as soon as you remember. However, if it is time for the next dose of ACIFORMIN 500 TABLET, skip the missed dose and take the next one regularly. Do not take a double dose to compensate the missed ones.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: What are the most common side effects of taking ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: The most common side effects of taking ACIFORMIN 500 TABLET are nausea, stomach upset and diarrhea. These side effects can be controlled when ACIFORMIN 500 TABLET is taken along with meals. However, if these side effect bothers you or worsens contact your doctor.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: Can I stop taking ACIFORMIN 500 TABLET without consulting your doctor?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: No. You should not stop taking ACIFORMIN 500 TABLET without consulting your doctor because it may lead to reversal of symptoms. If you feel better after using ACIFORMIN 500 TABLET, consult your doctor for advice.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: Will taking a higher dose of ACIFORMIN 500 TABLET be more effective?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: No, taking a higher dose of ACIFORMIN 500 TABLET will not be effective rather it can lead to toxicity. Always take the dose prescribed by your doctor. If the prescribed dose is not effective for you, consult your doctor for advice. Your doctor might increase the dose or suggest an alternative therapy.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: What precautions do I need to follow while taking ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: Before taking ACIFORMIN 500 TABLET inform your doctor if you have any liver, kidney or heart problems. You must also inform your doctor if you have any severe systemic infections or are severely dehydrated due to excessive vomiting or diarrhea recently. Along with the therapy, follow the diet and lifestyle changes advised by your doctor to achieve better results. Consult your doctor before taking ACIFORMIN 500 TABLET if you are pregnant or breastfeeding.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: Can I take medication for high blood pressure along with ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: It is not advisable to take medicines to control blood pressure while taking ACIFORMIN 500 TABLET without consulting your doctor. Therefore, consult your doctor before taking any antihypertensive such as beta blockers (Ex. atenolol, propranolol) along with ACIFORMIN 500 TABLET as they have known interactions with ACIFORMIN 500 TABLET.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: What should I do if I experience low blood sugar after taking ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: ACIFORMIN 500 TABLET is unlikely to cause low blood sugar unless combined with other anti-diabetic medicine. However, if you experience any signs of low blood sugar levels (such as increased hunger, sweating, shakiness, weakness or an irregular heartbeat), consume a sugary snack or sugar drink immediately. Consult your doctor if the symptom did not improve.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: Can ACIFORMIN 500 TABLET be taken with insulin?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: Co-administration of ACIFORMIN 500 TABLET with insulin is considered risky as they are increased chances of hypoglycemia (decreased blood sugar levels). Consult your doctor before taking it.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: Can ACIFORMIN 500 TABLET be used in pregnant women?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: ACIFORMIN 500 TABLET should be used during pregnancy only if it is considered necessary by the physician. Therefore, consult your doctor for advice.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: How to take ACIFORMIN 500 TABLET?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: You must take ACIFORMIN 500 TABLET as advised by your physician. Try to take this medicine preferably after meals and swallow it with a glass of water. Do not crush or chew the medicine.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div itemscope itemprop=\"mainEntity\" itemtype=\"https://schema.org/Question\" class=\"nms-faqpage-qanda\">\n\t\t<h3 itemprop=\"name\" class=\"nms-faqpage-question\">Q: How much ACIFORMIN 500 TABLET should I take?</h3>\n\t\t<div itemscope itemprop=\"acceptedAnswer\" itemtype=\"https://schema.org/Answer\" class=\"nms-faqpage-answer\">\n\t\t\t<div itemprop=\"text\">\n<p>A: ACIFORMIN 500 TABLET should be used only under medical supervision. Your doctor will decide the correct dose and duration of therapy for you depending upon your age, body condition and severity of the disease condition.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div> </div>  <div class=\"clear1\"></div></div></div></div><div id=\"np_tab25\" class=\"druginfo_cont druginfo-dv bottom-line active\"><div class=\"row\"><div class=\"col-md-12\"><div class=\"inner-content\"><h2 id=\"28\">References</h2><p>1. KD. Tripathi. Insulin, Oral Hypoglycaemic Drugs and Glucagon. Essentials of medical pharmacology. Seventh edition. 2013. Page &ndash; 275.</p>\n\n<p>2. Calette Corcoran;&nbsp;Tibb F. Jacobs. Metformin. StatPearls. NIH. National Library of Medicine. National center for biotechnology information. PMC. PubMed Central. [Revised on May 2022]. [Accessed on 14th October 2022] <a href=\"https://www.ncbi.nlm.nih.gov/books/NBK518983/#article-25065.s3\" target=\"_blank\">click here </a></p>\n\n<p>3. Shuyan Gu, Jihao Shi, Zhiliu Tang, Monika Sawhney, Huimei Hu, Lizheng Shi, Vivian Fonseca, Hengjin Dong. Comparison of Glucose Lowering Effect of Metformin and Acarbose in Type 2 Diabetes Mellitus: A Meta-Analysis. PLOS ONE. May 2015. [Accessed on 14th October 2022] <a href=\"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0126704\" target=\"_blank\">click here </a></p>\n\n<p>4. Milpharm Limited. Electronic Medicines Compendium (EMC). [Revised in June 2020] [Accessed on 14th October 2022] <a href=\"https://www.medicines.org.uk/emc/files/pil.594.pdf\" target=\"_blank\">click here </a></p>\n\n<p>5. Rx Farma Limited. Electronic Medicines Compendium (EMC). [Revised in September 2019] [Accessed on 14th October 2022] <a href=\"https://www.medicines.org.uk/emc/files/pil.11951.pdf\"
